[build]
  command = "npm run build"
  publish = "build"

# CRA treats ESLint warnings as errors when CI=true (Netlify’s default).
[build.environment]
  CI = "false"

# Always fetch fresh index.html so deploys show up without a hard refresh
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
